name: C++ build and offline tests
on:
  push:
    branches: [cpp-rewrite]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        build_type: [Debug, Release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev libssl-dev nlohmann-json3-dev openssl python3
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Validate all retained question banks
        shell: bash
        run: |
          for bank in qmyz/*.csv; do
            ./build/qmyz check-bank -c "$bank"
          done
