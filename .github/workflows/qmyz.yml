name: QMYZ C++ 云端运行
on:
  workflow_dispatch:
    inputs:
      account:
        description: '账号槽位（对应同名 Secret）'
        required: true
        default: QMYZ_LOGIN_URL
        type: choice
        options: [QMYZ_LOGIN_URL, QMYZ_LOGIN_URL_2, QMYZ_LOGIN_URL_3, QMYZ_LOGIN_URL_4, QMYZ_LOGIN_URL_5, QMYZ_LOGIN_URL_6, QMYZ_LOGIN_URL_7]
      mode:
        description: 'answer=实际提交；fight=对战并补库；courses=课程列表；check-bank=离线检查'
        required: true
        default: answer
        type: choice
        options: [answer, fight, courses, check-bank]
      course:
        description: '课程ID（7毛概，9马原）'
        required: true
        default: '9'
        type: choice
        options: ['2', '7', '8', '9', '10', '12', '50', '59', '61', '68', '138', '257', '444', '512', '520']
      count:
        description: 'answer实际提交题数 / fight场数（1–500）'
        required: true
        default: '10'
        type: string
      accuracy:
        description: '目标准确率（0–100，不保证精确达到）'
        required: true
        default: '100'
        type: string
permissions:
  contents: read
concurrency:
  group: qmyz-${{ inputs.account }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev libssl-dev nlohmann-json3-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - name: Run C++ application
        env:
          QMYZ_LOGIN_URL: ${{ secrets[inputs.account] }}
          QMYZ_MODE: ${{ inputs.mode }}
          QMYZ_COURSE: ${{ inputs.course }}
          QMYZ_COUNT: ${{ inputs.count }}
          QMYZ_ACCURACY: ${{ inputs.accuracy }}
        shell: bash
        run: |
          [[ "$QMYZ_COUNT" =~ ^[0-9]{1,3}$ ]] && ((10#$QMYZ_COUNT >= 1 && 10#$QMYZ_COUNT <= 500)) || { echo '数量必须为1–500'; exit 1; }
          [[ "$QMYZ_ACCURACY" =~ ^[0-9]{1,3}$ ]] && ((10#$QMYZ_ACCURACY <= 100)) || { echo '准确率必须为0–100'; exit 1; }
          ./build/qmyz "$QMYZ_MODE" -i "$QMYZ_COURSE" -c "qmyz/$QMYZ_COURSE.csv" -n "$QMYZ_COUNT" -a "$QMYZ_ACCURACY" --summary summary.json
      - name: Retain answer statistics
        if: always() && inputs.mode == 'answer'
        uses: actions/upload-artifact@v4
        with:
          name: answer-statistics
          path: summary.json
          if-no-files-found: ignore
      - name: Retain updated combat bank
        if: success() && inputs.mode == 'fight'
        uses: actions/upload-artifact@v4
        with:
          name: updated-bank
          path: qmyz/${{ inputs.course }}.csv
